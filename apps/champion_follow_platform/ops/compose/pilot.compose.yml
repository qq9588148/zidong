name: ${PILOT_PROJECT_NAME:?set PILOT_PROJECT_NAME}

x-server-build: &server-build
  context: ../..
  dockerfile: server/Dockerfile

x-common-environment: &common-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  CHAMPION_DATABASE_URL: ${CHAMPION_DATABASE_URL:?set CHAMPION_DATABASE_URL}
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${PILOT_POSTGRES_PORT:-55440}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - pilot-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate-core:
    build: *server-build
    command: ["python", "-m", "champion_follow.cli", "migrate"]
    environment: *common-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-auth:
    build: *server-build
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *common-environment
    depends_on:
      migrate-core:
        condition: service_completed_successfully
    restart: "no"

  schema-check:
    build: *server-build
    command: ["python", "/opt/champion-follow/ops/migrations/check_schema.py"]
    environment: *common-environment
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    restart: "no"

  server:
    build: *server-build
    environment:
      <<: *common-environment
      CHAMPION_PUBLIC_BASE_URL: ${CHAMPION_PUBLIC_BASE_URL:?set CHAMPION_PUBLIC_BASE_URL}
      CHAMPION_TRUSTED_ADMIN_ORIGIN: ${CHAMPION_TRUSTED_ADMIN_ORIGIN:?set CHAMPION_TRUSTED_ADMIN_ORIGIN}
      CHAMPION_TASK_SIGNING_KEY_PATH: /run/secrets/task-signing.pem
      CHAMPION_SECRET_VAULT_KEY_PATH: /run/secrets/vault.key
      CHAMPION_ALLOCATION_SEED_PATH: /run/secrets/allocation-seed.key
      CHAMPION_ALLOCATION_SEED_VERSION: ${CHAMPION_ALLOCATION_SEED_VERSION:-allocation-v1}
      CHAMPION_TOKEN_PEPPER: ${CHAMPION_TOKEN_PEPPER:?set CHAMPION_TOKEN_PEPPER}
    secrets:
      - task-signing
      - vault-key
      - allocation-seed
    depends_on:
      schema-check:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PILOT_SERVER_PORT:-58000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2))['status'] == 'ok'"
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

secrets:
  task-signing:
    file: ${PILOT_RUN_DIR:?set PILOT_RUN_DIR}/task-signing.pem
  vault-key:
    file: ${PILOT_RUN_DIR:?set PILOT_RUN_DIR}/vault.key
  allocation-seed:
    file: ${PILOT_RUN_DIR:?set PILOT_RUN_DIR}/allocation-seed.key

volumes:
  pilot-postgres:
    labels:
      com.champion-follow.pilot: "true"
      com.champion-follow.run-id: ${PILOT_RUN_ID:?set PILOT_RUN_ID}
